<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="900">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindle Calendar</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: 26px 34px;
      background: #ffffff;
      color: #000000;
      width: 100vh;
      height: 100vw;
      transform: rotate(90deg);
      transform-origin: top left;
      position: absolute;
      top: 0;
      left: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .header {
      border-bottom: 4px solid #000000;
      padding-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .date-box .date {
      font-size: 46px;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.5px;
    }
    .date-box .weekday {
      font-size: 32px;
      font-weight: 700;
      margin-top: 6px;
    }
    .weather {
      font-size: 28px;
      font-weight: 700;
      text-align: right;
      line-height: 1.3;
    }
    .events {
      flex: 1;
      padding: 18px 0;
      overflow: hidden;
    }
    .event {
      display: flex;
      align-items: baseline;
      padding: 10px 0;
      border-bottom: 1px dashed #666666;
      font-size: 34px;
      line-height: 1.25;
    }
    .event:last-child {
      border-bottom: none;
    }
    .event .time {
      font-weight: 800;
      min-width: 120px;
      display: inline-block;
    }
    .event .title {
      font-weight: 600;
    }
    .empty {
      font-size: 34px;
      color: #333333;
      margin-top: 36px;
      text-align: center;
    }
    .footer {
      font-size: 20px;
      color: #333333;
      border-top: 2px solid #000000;
      padding-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="date-box">
      <div class="date">2026年11月27日</div>
      <div class="weekday">周五</div>
    </div>
    <div class="weather">多伦多 小毛毛雨 2°C（0~5°C）</div>
  </div>
  <div class="events">
    <div class="empty">今天没有日程安排</div>
  </div>
  <div class="footer">
    更新于 05:29 · 每15分钟自动刷新
  </div>
</body>
</html>
