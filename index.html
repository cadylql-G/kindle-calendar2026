<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="900">
<title>今日日程</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 36px 40px;
    background: #FFFFFF;
    color: #000000;
    font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  }
  .header {
    border-bottom: 4px solid #000000;
    padding-bottom: 22px;
    margin-bottom: 28px;
  }
  .date {
    font-size: 56px;
    font-weight: 700;
    line-height: 1.2;
  }
  .weekday {
    font-size: 38px;
    font-weight: 600;
    margin-top: 8px;
  }
  .item {
    border-bottom: 2px solid #CCCCCC;
    padding: 22px 0;
    font-size: 34px;
    line-height: 1.4;
  }
  .time {
    display: inline-block;
    min-width: 140px;
    font-weight: 700;
  }
  .title {
    font-weight: 500;
  }
  .empty {
    margin-top: 80px;
    text-align: center;
    font-size: 38px;
    color: #444444;
  }
  .footer {
    margin-top: 36px;
    font-size: 24px;
    color: #555555;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="date">2026年11月25日</div>
    <div class="weekday">周三</div>
  </div>
  <div class="list">
    <div class="empty">今天没有日程安排</div>
  </div>
  <div class="footer">更新于 19:59 · 每15分钟自动刷新</div>
</body>
</html>
